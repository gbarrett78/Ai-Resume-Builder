name: Deploy Resume 
on:
  pull_request: 
    branches: [ main ]
  push: 
    branches: [ main ]

jobs: 
    deploy:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Configure AWS Credentials 
          uses: aws-actions/configure-aws-credentials@v4
          with: 
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

  

        - name: Deploy Infrastructure
          uses: aws-actions/aws-cloudformation-github-deploy@v1
          with:
            name: ResumeStack
            template: cloudformation.yaml 
            capabilities: CAPABILITY_NAMED_IAM
            no-fail-on-empty-changeset: "1"
            parameter-overrides: |
              WebsiteBucketName=granville-cloudresume-jan2026

        - name: Set up Python 
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install Python dependencies
          run: | 
            python -m pip install --upgrade pip
            echo "=== Checking for requirements.txt ==="
            ls -la requirements.txt
            cat requirements.txt
            echo "=== Installing dependencies ==="
            pip install boto3
            pip install -r requirements.txt
            echo "=== Verifying anthropic is installed ==="
            pip list | grep anthropic

        # --- BETA LOGIC (Pull Request) ---
        - name: Build & Analyze (Beta)
          if: github.event_name == 'pull_request'
          env:
            TABLE_NAME: DeploymentTracking
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
            GITHUB_SHA: ${{ github.sha }}
            BUCKET_NAME: granville-cloudresume-jan2026
          run: |
            python infrastructure/scripts/process_resume.py
            test -f  index.html
            aws s3 cp index.html s3://granville-cloudresume-jan2026/beta/index.html
            # Script should also write to DynamoDB DeploymentTracking & ResumeAnalytics 

        # --- Prod LOGIC (Merge to Main) ---
        - name: Promote to Prod
          if: github.event_name == 'push' && github.ref == 'refs/heads/main'
          run: |
            if aws s3 ls s3://granville-cloudresume-jan2026/beta/index.html 2>/dev/null; then
              aws s3 cp s3://granville-cloudresume-jan2026/beta/index.html s3://granville-cloudresume-jan2026/prod/index.html
              echo "✓ Promoted beta to prod"
            else
              echo "⚠ No beta/index.html found - skipping promotion"
            fi