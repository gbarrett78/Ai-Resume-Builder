AWSTemplateFormatVersion: '2010-09-09'
Description: Cloud Resume Challenge - S3 website, DynamoDB visitor counter, GitHub Actions OIDC role

Parameters:
  GitHubOrgAndRepo:
    Type: String
    Description: "e.g. gbarret78/cloud-resume"

  WebsiteBucketName:
    Type: String
    Description: "Globally unique S3 bucket name for resume website"

  GitHubOIDCProviderArn:
    Type: String
    Description: "arn:aws:iam::<account-id>:oidc-provider/token.actions.githubusercontent.com"

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref WebsiteBucketName
      VersioningConfiguration:
        Status: Enabled
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicRead
            Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${WebsiteBucketName}/*"

  VisitorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloud-resume-visitors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudResumeGitHubActionsRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProviderArn
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOrgAndRepo}:*"
      Policies:
        - PolicyName: CloudResumeDeployPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:PutObjectAcl"
                  - "s3:DeleteObject"
                Resource: !Sub "arn:aws:s3:::${WebsiteBucketName}/*"

              - Effect: Allow
                Action:
                  - "s3:ListBucket"
                Resource: !Sub "arn:aws:s3:::${WebsiteBucketName}"

              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                  - "dynamodb:UpdateItem"
                  - "dynamodb:PutItem"
                Resource: !GetAtt VisitorTable.Arn

Outputs:
  WebsiteBucketName:
    Value: !Ref WebsiteBucketName

  VisitorTableName:
    Value: !Ref VisitorTable

  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
