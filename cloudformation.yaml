AWSTemplateFormatVersion: "2010-09-09"
Description: Cloud Resume Challenge - S3 static website + DynamoDB visitor counter

Parameters:
  WebsiteBucketName:
    Type: String
    Description: Globally unique S3 bucket name for resume website

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref WebsiteBucketName
      VersioningConfiguration:
        Status: Enabled
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action:
              - "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${WebsiteBucketName}/*"

  VisitorTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: cloud-resume-visitors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  WebsiteBucketName:
    Value: !Ref WebsiteBucketName

  WebsiteUrl:
    Description: S3 static website endpoint (HTTP)
    Value: !GetAtt WebsiteBucket.WebsiteURL

  VisitorTableName:
    Value: !Ref VisitorTable

  VisitorTableArn:
    Value: !GetAtt VisitorTable.Arn


  